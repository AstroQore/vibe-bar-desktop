[package]
name = "vibebar-desktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-independent core of Vibe Bar Desktop: shared-data readers, provider quota adapters, and refresh scheduling."

[dependencies]
agent-session-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "process", "io-util"] }
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
iana-time-zone = "0.1"
# Capability-scoped filesystem handles. Keep these exact: older releases have
# had symlink-resolution advisories and are not suitable for this boundary.
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
# Used only to build a deliberately-wrong-schema index fixture and prove the
# reader refuses it without touching the file.
rusqlite = { version = "0.32", features = ["bundled"] }
