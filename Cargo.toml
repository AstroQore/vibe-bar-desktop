[workspace]
resolver = "2"
members = ["crates/vibebar-desktop-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/AstroQore/vibe-bar-desktop"

[workspace.dependencies]
# The Rust lane of agent-session-kit. Pinned to the reviewed PR revision until
# AstroQore/agent-session-kit#12 merges and publishes a tag. Never depend on a
# mutable branch here: this workspace contains a shipped application and two
# builds of the same commit must resolve the same session implementation.
# To develop against a local checkout, add a `[patch]` section to
# `.cargo/config.toml` rather than editing this file.
agent-session-core = { git = "https://github.com/AstroQore/agent-session-kit", rev = "b3d79734b6fbf571ec959a8147ad9f62f56bf43c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
