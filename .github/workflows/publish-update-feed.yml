name: Publish update feed

on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serializes writes to the updates branch. Not an event queue: every run that
  # survives rebuilds both documents from what is actually published, so a run
  # that loses the race has nothing to lose.
  group: update-feed
  cancel-in-progress: false

jobs:
  publish:
    name: Rebuild latest-main.json and latest-dev.json
    runs-on: ubuntu-latest
    steps:
      # The default branch, not the tag that triggered this.
      #
      # A `release` event runs the workflow from the released tag's ref, so
      # the builder would be whatever version that tag happened to carry. The
      # feed is not a property of one release — every run rebuilds both
      # documents from everything published — so its contents would flip
      # between builder versions depending on which release last fired an
      # event. Editing an old release's notes would be enough to regress it.
      #
      # This happened: v0.1.0-dev.1 published with a builder fix already on
      # main, and the feed came out with two platforms instead of six because
      # the run used the tag's older copy.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read the published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The bundler's own manifest carries a signature and URL per target;
          # the API does not inline asset contents, so it is fetched and folded
          # onto the asset as `_contents`, which is what the builder reads.
          # `--slurp` gives an array of pages; flattening it is one line and
          # does not depend on how the runner's `gh` chooses to join them.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > releases.raw.json
          python3 - <<'PY'
          import json, os, subprocess
          releases = [r for page in json.load(open("releases.raw.json")) for r in page]
          for release in releases:
              for asset in release.get("assets", []):
                  if asset["name"] != "latest.json":
                      continue
                  asset["_contents"] = subprocess.run(
                      ["gh", "api", "-H", "Accept: application/octet-stream",
                       f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset['id']}"],
                      capture_output=True, text=True, check=True,
                  ).stdout
          json.dump(releases, open("releases.json", "w"))
          PY

      - name: Build the documents
        run: |
          python3 scripts/tests/run_tests.py
          python3 scripts/build_update_feed.py releases.json --out feed

      - name: Commit them to the updates branch
        run: |
          if [ -z "$(ls -A feed 2>/dev/null)" ]; then
            echo "nothing published that the feed can describe yet"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin updates || true
          git checkout -B updates origin/updates 2>/dev/null || git checkout --orphan updates
          git rm -rq --cached . 2>/dev/null || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name feed ! -name releases.json ! -name releases.raw.json -exec rm -rf {} +
          mv feed/* .
          rm -f releases.json releases.raw.json
          git add -A
          git diff --cached --quiet && { echo "feed unchanged"; exit 0; }
          git commit -m "Rebuild the update feed"
          git push origin updates
