name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  core:
    # The core crate carries every decision that is not about windows or
    # trays, so it must build and pass on all three targets from day one —
    # that is what keeps macOS-only assumptions from creeping in.
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # The shell crate needs these to build at all on Linux; the core crate
      # does not, which is why they were not here before.
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file libssl-dev libgtk-3-dev libxdo-dev

      - run: cargo test -p vibebar-desktop-core --locked
      - run: cargo clippy -p vibebar-desktop-core --all-targets --locked -- -D warnings

      # The shell too, not just the core. Half of Tauri's API is behind a
      # platform cfg, so code that compiles here can fail to exist there —
      # `RunEvent::Reopen` is macOS-only, and a release built four broken
      # targets before anyone found out. A check rather than a build: this
      # is about whether the code exists on the platform, and a bundle takes
      # ten times as long to say the same thing.
      - run: cargo check -p vibe-bar-desktop --locked

  app:
    name: app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node 22.13 or newer.
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Test the frontend
        working-directory: apps/desktop
        run: pnpm test
      - name: Typecheck and build the frontend
        working-directory: apps/desktop
        run: pnpm build
      - name: The version is one fact, in three files
        run: ./scripts/check_versions.sh
      - name: Test the release scripts
        run: python3 scripts/tests/run_tests.py
      - name: Test and lint the whole workspace
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build the app
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle -- --locked
