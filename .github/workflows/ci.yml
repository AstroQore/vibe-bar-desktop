name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    # The core crate carries every decision that is not about windows or
    # trays, so it must build and pass on all three targets from day one —
    # that is what keeps macOS-only assumptions from creeping in.
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p vibebar-desktop-core
      - run: cargo clippy -p vibebar-desktop-core --all-targets -- -D warnings

  app:
    name: app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build the frontend
        working-directory: apps/desktop
        run: pnpm build
      - name: Test and lint the whole workspace
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the app
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle
